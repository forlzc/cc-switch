# 在 fork 上直接产出一个可安装的 Windows 安装包。
#
# 上游的 release.yml 走的是正式发布链路：它要求 TAURI_SIGNING_PRIVATE_KEY
# （.github/actions/prepare-tauri-signing-key 在 Secret 为空时会直接 exit 1），
# macOS 那两个 job 还要求 Apple 证书与公证凭据。fork 上没有这些 Secrets，
# 所以那条链路在编译之前就会失败。这里换成一条只依赖公开 runner 的打包路径：
#   关掉 bundle.createUpdaterArtifacts（否则 Tauri 会因缺签名私钥中断打包），
#   只打 MSI + 便携 exe，产物作为工作流 artifact 上传。
#
# 注意：产物没有 Authenticode 签名，Windows SmartScreen 会提示未知发布者。
name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Tauri --bundles 取值（逗号分隔，可选 msi/nsis）"
        required: false
        default: "msi"
  # 只在改到本文件时触发：改完打包配置就能立刻出一个包，
  # 日常推代码不会每次都白跑一遍二十分钟的构建（那种情况用上面的手动触发）。
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # rust-toolchain.toml 是编译器版本的唯一来源，和 CI / Release 保持一致
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # 只缓存依赖：本仓库的 crate 每次都要重编，缓存它只会让缓存变大、恢复变慢
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: installer

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # fork 上没有 TAURI_SIGNING_PRIVATE_KEY，关掉 updater 产物生成，
      # 否则 Tauri 会因为找不到签名私钥而中断打包。
      # 只改 runner 上的检出文件，不动仓库里的 src-tauri/tauri.conf.json。
      - name: Disable updater artifacts (no signing key on this fork)
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          node -e "const c=require('./src-tauri/tauri.conf.json');console.log('createUpdaterArtifacts =',c.bundle.createUpdaterArtifacts);"

      - name: Build installer
        shell: bash
        env:
          # push 触发时 inputs 是空的，退回默认的 msi
          BUNDLES: ${{ inputs.bundles || 'msi' }}
        run: pnpm tauri build --bundles "$BUNDLES"

      - name: List built artifacts
        shell: bash
        run: |
          echo "=== bundle/msi ==="
          ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "(无 msi 目录)"
          echo "=== 便携 exe ==="
          ls -la src-tauri/target/release/*.exe 2>/dev/null || echo "(无 exe)"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: ignore
