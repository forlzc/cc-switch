# 在 fork 上直接产出一个可安装的 Windows 安装包，并自动发布到 fork 的 Releases。
#
# 上游的 release.yml 走的是正式发布链路：它要求 TAURI_SIGNING_PRIVATE_KEY
# （.github/actions/prepare-tauri-signing-key 在 Secret 为空时会直接 exit 1），
# macOS 那两个 job 还要求 Apple 证书与公证凭据，release job 又挂在需要人工审批的
# release environment 上。fork 上没有这些 Secrets，那条链路在编译之前就会失败。
# 这里换成一条只依赖公开 runner 的「编译 + 发布」路径：
#   关掉 bundle.createUpdaterArtifacts（否则 Tauri 会因缺签名私钥中断打包），
#   只打 MSI + 便携 exe，构建完成后自动创建一个 GitHub Release 并附上产物。
#   Release 用 GITHUB_TOKEN 发布，不需要任何签名 / 证书。
#
# 怎么触发（本文件位于 fork/build 分支，不在默认分支 main 上）：
#   1) 打标签：git tag fork-v1 && git push origin fork-v1
#      或在 GitHub 的 Releases 页面「Draft a new release」里选 fork/build 分支新建 fork-v* 标签。
#      tag 触发不受“workflow 必须位于默认分支”的限制，是这里的主用方式。
#   2) 推到 main / fork/build 分支时也会构建。
#   3) Actions 页里的「Run workflow」按钮只有在默认分支存在该文件时才可用；若需要，
#      把本文件复制一份到 main 即可（见仓库说明）。
#
# 注意：产物没有 Authenticode 签名，Windows SmartScreen 会提示未知发布者；
# 因为没有 updater 签名，fork 上的应用内自动更新不可用。这两点都不影响发布。
name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Tauri --bundles 取值（逗号分隔，可选 msi/nsis）"
        required: false
        default: "msi"
      tag:
        description: "Release 标签（留空用 fork-build-<运行号>）"
        required: false
        default: ""
  # tag 触发：不受“workflow 必须位于默认分支”的限制，在 fork/build 上打 fork-* tag 即可出包。
  # 分支触发：推到 main / fork/build 时构建。
  # 注意：GitHub 对 tag 触发会忽略 paths，所以这里不写 paths，否则 tag 可能不触发。
  push:
    branches: [main, fork/build]
    tags:
      - "fork-v*"

# 创建 Release 需要写权限；仓库 Settings → Actions → General 里也要选
# "Read and write permissions"，否则 GITHUB_TOKEN 无权创建 Release。
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # rust-toolchain.toml 是编译器版本的唯一来源，和 CI / Release 保持一致
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # 只缓存依赖：本仓库的 crate 每次都要重编，缓存它只会让缓存变大、恢复变慢
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: installer

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # fork 上没有 TAURI_SIGNING_PRIVATE_KEY，关掉 updater 产物生成，
      # 否则 Tauri 会因为找不到签名私钥而中断打包。
      # 只改 runner 上的检出文件，不动仓库里的 src-tauri/tauri.conf.json。
      - name: Disable updater artifacts (no signing key on this fork)
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          node -e "const c=require('./src-tauri/tauri.conf.json');console.log('createUpdaterArtifacts =',c.bundle.createUpdaterArtifacts);"

      - name: Build installer
        shell: bash
        env:
          # push 触发时 inputs 是空的，退回默认的 msi
          BUNDLES: ${{ inputs.bundles || 'msi' }}
        run: pnpm tauri build --bundles "$BUNDLES"

      - name: List built artifacts
        shell: bash
        run: |
          echo "=== bundle/msi ==="
          ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "(无 msi 目录)"
          echo "=== 便携 exe ==="
          ls -la src-tauri/target/release/*.exe 2>/dev/null || echo "(无 exe)"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: ignore

      # 计算 Release 标签：tag 触发用 tag 名，手动触发优先用输入，否则用运行号。
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=fork-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # 这一步才是“能自动 release”的关键：之前只有 upload-artifact，产物停在
      # workflow 里，fork 的 Releases 页不会出现任何东西。用 GITHUB_TOKEN 直接
      # 把产物发布成一个 Release；无签名也能发布，只是 SmartScreen 会提示未知发布者。
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          prerelease: true
          body: |
            自动构建的 Windows 安装包（无 Authenticode 签名，SmartScreen 会提示未知发布者）。
            应用内自动更新在 fork 上不可用。
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
